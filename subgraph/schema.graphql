type Launchpad @entity {
  id: ID!
  totalTokens: Int!
  totalTrades: Int!
  totalVolume: BigInt!
  totalFees: BigInt!
  wrappers: [WrapperToken!]! @derivedFrom(field: "launchpad")
  protocolMetric: ProtocolMetric @derivedFrom(field: "launchpad")
}

type WrapperToken @entity {
  id: ID!                    # wrapper address
  launchpad: Launchpad!
  rt: Bytes!
  ipAsset: Bytes!
  creator: Bytes!
  launchTime: BigInt!
  totalLocked: BigInt!
  graduated: Boolean!
  dexReserve: BigInt!
  initialCurveSupply: BigInt!
  totalRoyaltiesHarvested: BigInt!
  totalFees: BigInt!
  poolAddress: Bytes
  lpTokenId: BigInt
  createdAt: BigInt!
  updatedAt: BigInt!

  trades: [Trade!]! @derivedFrom(field: "wrapper")
  harvests: [Harvest!]! @derivedFrom(field: "wrapper")
  graduations: [Graduation!]! @derivedFrom(field: "token")
  holders: [Holder!]! @derivedFrom(field: "wrapper")
  redemptions: [Redemption!]! @derivedFrom(field: "wrapper")
  tokenStat: TokenStat @derivedFrom(field: "wrapper")
  harvestEvents: [HarvestEvent!]! @derivedFrom(field: "wrapper")
  buybackEvents: [BuybackEvent!]! @derivedFrom(field: "wrapper")
}

type ProtocolMetric @entity {
  id: ID!
  launchpad: Launchpad!
  totalRoyaltiesQueued: BigInt!
  totalRoyaltiesPushed: BigInt!
  totalHarvestedPreGrad: BigInt!
  totalHarvestedPostGrad: BigInt!
  totalBuybacks: BigInt!
}

type TokenStat @entity {
  id: ID! # wrapper address
  wrapper: WrapperToken!
  accumulatedFeesNative: BigInt!
  totalHarvested: BigInt!
}

type Redemption @entity {
  id: ID!
  wrapper: WrapperToken!
  redeemer: User
  wrapperAmount: BigInt!
  rtAmount: BigInt!
  recipient: Bytes!
  txHash: Bytes!
  timestamp: BigInt!
}

type User @entity {
  id: ID!                    # user address
  trades: [Trade!]! @derivedFrom(field: "user")
  deposits: [Deposit!]! @derivedFrom(field: "user")
  redemptions: [Redemption!]! @derivedFrom(field: "redeemer")
}

enum TradeType {
  BUY
  SELL
}

type Trade @entity {
  id: ID!
  wrapper: WrapperToken!
  user: User
  type: TradeType!
  amount: BigInt!            # wrapper units (smallest units)
  value: BigInt!             # base cost / proceeds
  fee: BigInt!               # fee amount (as emitted)
  txHash: Bytes!
  timestamp: BigInt!
}

type Deposit @entity {
  id: ID!
  user: User!
  rt: Bytes!
  amount: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Harvest @entity {
  id: ID!
  wrapper: WrapperToken!
  amount: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
}

type HarvestEvent @entity {
  id: ID!
  wrapper: WrapperToken!
  amount: BigInt!
  isPostGrad: Boolean!
  txHash: Bytes!
  timestamp: BigInt!
}

type BuybackEvent @entity {
  id: ID!
  wrapper: WrapperToken!
  amountIn: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
}

type Graduation @entity {
  id: ID!
  token: WrapperToken!
  totalLiquidity: BigInt!
  pool: Bytes!
  lpTokenId: BigInt
  txHash: Bytes!
  timestamp: BigInt!
}

type PremineClaim @entity {
  id: ID!
  wrapper: WrapperToken!
  creator: Bytes!
  amount: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
}

type GraduationThresholdUpdate @entity {
  id: ID!
  launchpad: Launchpad!
  newThreshold: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
}

type Holder @entity {
  id: ID!                 # wrapper-address + user-address
  wrapper: WrapperToken!
  user: User!
  balance: BigInt!        # wrapper units (smallest units)
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Candle @entity {
  id: ID!
  wrapper: WrapperToken!
  interval: Int!
  timestamp: BigInt!
  open: BigInt!
  high: BigInt!
  low: BigInt!
  close: BigInt!
  volume: BigInt!
}