type Launchpad @entity {
  id: ID!
  totalTokens: Int!
  totalTrades: Int!
  totalVolume: BigInt!
  totalFees: BigInt!
  wrappers: [WrapperToken!]! @derivedFrom(field: "launchpad")
}

type WrapperToken @entity {
  id: ID!                    # wrapper address
  launchpad: Launchpad!
  rt: Bytes!
  creator: Bytes!
  launchTime: BigInt!
  totalLocked: BigInt!
  graduated: Boolean!
  dexReserve: BigInt!
  initialCurveSupply: BigInt!
  totalRoyaltiesHarvested: BigInt!
  totalFees: BigInt!
  poolAddress: Bytes
  createdAt: BigInt!
  updatedAt: BigInt!

  trades: [Trade!]! @derivedFrom(field: "wrapper")
  harvests: [Harvest!]! @derivedFrom(field: "wrapper")
  graduations: [GraduationEvent!]! @derivedFrom(field: "wrapper")
  holders: [Holder!]! @derivedFrom(field: "wrapper")
}

type User @entity {
  id: ID!                    # user address
  trades: [Trade!]! @derivedFrom(field: "user")
  deposits: [Deposit!]! @derivedFrom(field: "user")
}

enum TradeType {
  BUY
  SELL
}

type Trade @entity {
  id: ID!
  wrapper: WrapperToken!
  user: User
  type: TradeType!
  amount: BigInt!            # wrapper units (smallest units)
  value: BigInt!             # base cost / proceeds
  fee: BigInt!               # approximate 1% fee (for analytics)
  txHash: Bytes!
  timestamp: BigInt!
}

type Deposit @entity {
  id: ID!
  user: User!
  rt: Bytes!
  amount: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Harvest @entity {
  id: ID!
  wrapper: WrapperToken!
  amount: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
}

type GraduationEvent @entity {
  id: ID!
  wrapper: WrapperToken!
  liquidity: BigInt!
  poolAddress: Bytes!
  txHash: Bytes!
  timestamp: BigInt!
}

type PremineClaim @entity {
  id: ID!
  wrapper: WrapperToken!
  creator: Bytes!
  amount: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
}

type GraduationThresholdUpdate @entity {
  id: ID!
  launchpad: Launchpad!
  newThreshold: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
}

type Holder @entity {
  id: ID!                 # wrapper-address + user-address
  wrapper: WrapperToken!
  user: User!
  balance: BigInt!        # wrapper units (smallest units)
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Candle @entity {
  id: ID!
  wrapper: WrapperToken!
  interval: Int!
  timestamp: BigInt!
  open: BigInt!
  high: BigInt!
  low: BigInt!
  close: BigInt!
  volume: BigInt!
}