specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: SovryLaunchpad
    network: story-aeneid
    source:
      address: "0x0285659cd53319b7a37c20FFBc5395Ec187Bfffa" # Aeneid launchpad (update for mainnet)
      abi: SovryLaunchpad
      startBlock: 11799205
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Launchpad
        - WrapperToken
        - User
        - Trade
        - Deposit
        - Harvest
        - GraduationEvent
        - Holder
      abis:
        - name: SovryLaunchpad
          file: ./abis/SovryLaunchpad.json
      eventHandlers:
        - event: TokenLaunched(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTokenLaunched
        - event: TokensPurchased(indexed address,indexed address,uint256,uint256)
          handler: handleTokensPurchased
        - event: TokensSold(indexed address,indexed address,uint256,uint256)
          handler: handleTokensSold
        - event: RoyaltiesHarvested(indexed address,uint256)
          handler: handleRoyaltiesHarvested
        - event: Graduated(indexed address,uint256,indexed address)
          handler: handleGraduated
        - event: RTDeposited(indexed address,indexed address,uint256)
          handler: handleRTDeposited
        - event: RTWithdrawn(indexed address,indexed address,uint256)
          handler: handleRTWithdrawn
      file: ./src/launchpad.ts

templates:
  - kind: ethereum
    name: WrapperToken
    network: story-aeneid
    source:
      abi: ERC20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Holder
        - User
        - WrapperToken
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/wrapperToken.ts