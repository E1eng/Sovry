specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: SovryFactory
    network: story-aeneid
    source:
      address: "0x96Ca2E66d0ae229B16EE9aCbBA9B96470b28c8D4" # Aeneid launchpad (update for mainnet)
      abi: SovryFactory
      startBlock: 12093886
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Launchpad
        - WrapperToken
        - User
        - Trade
        - Deposit
        - Harvest
        - HarvestEvent
        - BuybackEvent
        - TokenStat
        - ProtocolMetric
        - Graduation
        - Holder
        - PremineClaim
        - GraduationThresholdUpdate
        - Candle
      abis:
        - name: SovryFactory
          file: ./abis/SovryFactory.json
      eventHandlers:
        - event: TokenLaunched(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTokenLaunched
      file: ./src/launchpad.ts

templates:
  - kind: ethereum
    name: SovryExchange
    network: story-aeneid
    source:
      abi: SovryExchange
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Launchpad
        - WrapperToken
        - User
        - Trade
        - Deposit
        - Harvest
        - HarvestEvent
        - BuybackEvent
        - TokenStat
        - ProtocolMetric
        - Graduation
        - Holder
        - PremineClaim
        - GraduationThresholdUpdate
        - Candle
      abis:
        - name: SovryExchange
          file: ./abis/SovryExchange.json
      eventHandlers:
        - event: TokensPurchased(indexed address,indexed address,uint256,uint256,uint256,address)
          handler: handleTokensPurchased
        - event: TokensSold(indexed address,indexed address,uint256,uint256,uint256,address)
          handler: handleTokensSold
        - event: TokensRedeemed(indexed address,indexed address,uint256,uint256,indexed address)
          handler: handleTokensRedeemed
        - event: RoyaltyRevenueQueued(indexed address,uint256)
          handler: handleRoyaltyRevenueQueued
        - event: RoyaltyRevenueProcessed(indexed address,uint256,address)
          handler: handleRoyaltyRevenueProcessed
        - event: RevenueHarvested(indexed address,uint256,bool)
          handler: handleRevenueHarvested
        - event: BuybackExecuted(indexed address,uint256)
          handler: handleBuybackExecuted
        - event: Graduated(indexed address,uint256,indexed address)
          handler: handleGraduated
        - event: GraduationThresholdUpdated(uint256)
          handler: handleGraduationThresholdUpdated
      file: ./src/launchpad.ts

  - kind: ethereum
    name: WrapperToken
    network: story-aeneid
    source:
      abi: ERC20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Holder
        - User
        - WrapperToken
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/wrapperToken.ts